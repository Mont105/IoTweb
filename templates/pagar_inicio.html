{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h3 mb-3"><i class="bi bi-credit-card"></i> Pagar peaje</h1>
        <p class="text-secondary">Ingresa la patente del vehículo para ver sus cobros pendientes.</p>
        <form method="get" action="{{ url_for('pagar_inicio') }}">
          <input class="form-control form-control-lg text-uppercase mb-3" name="patente" placeholder="Patente" autofocus required>
          <button class="btn btn-primary btn-lg w-100">Continuar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
