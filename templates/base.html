<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peaje IoT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-body-tertiary border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}"><i class="bi bi-ev-front"></i> Peaje IoT</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('dashboard') }}">Registros</a>
      <a class="nav-link" href="{{ url_for('vehiculos') }}">Vehículos</a>
      <a class="nav-link" href="{{ url_for('pagar_inicio') }}">Pagar</a>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
  <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
